<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Video Downloader</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            ▶
        </div>

        <h1>YouTube Video Downloader</h1>

        <p class="subtitle">
            Video linkini daxil edin və MP4 formatında endirin.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form action="/download" method="POST">

            <input
                type="url"
                name="url"
                placeholder="https://www.youtube.com/watch?v=..."
                required
            >

            <button type="submit">
                Videonu endir
            </button>

        </form>

        <div class="info">
            Yalnız endirməyə icazəniz olan məzmunu istifadə edin.
        </div>

    </div>

</div>

</body>
</html>
